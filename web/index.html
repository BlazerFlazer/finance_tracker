<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="FinTrack — know your money, control your future. Budgets, goals, net worth, forecasts and more." />
    <title>FinTrack</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Applied before paint so there's no light-mode flash for users who prefer dark.
      (function () {
        try {
          var saved = localStorage.getItem('fintrack-theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
